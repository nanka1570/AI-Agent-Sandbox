<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakeibo App - Retro Pop Edition (JP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "hsl(45, 30%, 96%)",
                        foreground: "hsl(0, 0%, 10%)",
                        card: "hsl(0, 0%, 100%)",
                        "card-foreground": "hsl(0, 0%, 10%)",
                        primary: "hsl(265, 89%, 66%)",
                        secondary: "hsl(50, 100%, 65%)",
                        accent: "hsl(150, 90%, 40%)",
                        destructive: "hsl(340, 90%, 60%)",
                        muted: "hsl(210, 20%, 90%)",
                        border: "hsl(0, 0%, 10%)",
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
        }

        .neobrutal-card {
            border: 2px solid black;
            box-shadow: 4px 4px 0px 0px black;
            border-radius: 8px;
            /* Slightly rounded but blocky */
            transition: all 0.1s ease-in-out;
        }

        .neobrutal-card:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0px 0px black;
        }

        .neobrutal-btn {
            border: 2px solid black;
            box-shadow: 4px 4px 0px 0px black;
            font-weight: bold;
            transition: all 0.1s;
        }

        .neobrutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px black;
        }
    </style>
</head>

<body class="bg-background text-foreground min-h-screen flex flex-col p-4 md:p-8 gap-8">

    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between gap-4 max-w-5xl mx-auto w-full">
        <div
            class="neobrutal-btn bg-white px-6 py-3 flex items-center gap-2 transform -rotate-1 hover:rotate-0 transition-transform">
            <i data-lucide="wallet" class="w-8 h-8 text-black"></i>
            <h1 class="text-2xl font-black tracking-tighter">家計簿 APP</h1>
        </div>

        <nav class="flex gap-4">
            <a href="#" class="neobrutal-btn bg-secondary px-4 py-2 text-sm hover:bg-yellow-300">DASHBOARD</a>
            <a href="#" class="neobrutal-btn bg-white px-4 py-2 text-sm hover:bg-gray-100">CARDS</a>
            <a href="#" class="neobrutal-btn bg-white px-4 py-2 text-sm hover:bg-gray-100">PAYMENTS</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto w-full space-y-8">

        <!-- Month Selector & Title -->
        <div class="flex items-center justify-between border-b-4 border-black pb-4">
            <h2 class="text-4xl font-black italic uppercase">2024年 2月</h2>
            <div class="neobrutal-btn bg-white px-4 py-2 flex items-center gap-2 cursor-pointer">
                <span>2024 / 02</span>
                <i data-lucide="chevron-down" class="w-5 h-5"></i>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid gap-6 md:grid-cols-3">

            <!-- Income -->
            <div class="neobrutal-card bg-emerald-100 p-6 flex flex-col justify-between h-40">
                <div class="flex justify-between items-start">
                    <span class="font-bold border-b-2 border-black">収入</span>
                    <i data-lucide="arrow-up-circle" class="w-8 h-8"></i>
                </div>
                <div class="text-4xl font-black font-mono">¥245,000</div>
            </div>

            <!-- Expense -->
            <div class="neobrutal-card bg-rose-100 p-6 flex flex-col justify-between h-40">
                <div class="flex justify-between items-start">
                    <span class="font-bold border-b-2 border-black">支出</span>
                    <i data-lucide="arrow-down-circle" class="w-8 h-8"></i>
                </div>
                <div class="text-4xl font-black font-mono">¥82,000</div>
                <div class="w-full bg-white h-4 border-2 border-black mt-2 rounded-full overflow-hidden">
                    <div class="bg-rose-500 h-full w-[45%]"></div>
                </div>
            </div>

            <!-- Balance -->
            <div
                class="neobrutal-card bg-primary text-white p-6 flex flex-col justify-between h-40 relative overflow-hidden group">
                <div
                    class="absolute -right-4 -bottom-4 opacity-20 transform rotate-12 group-hover:rotate-0 transition-transform">
                    <i data-lucide="piggy-bank" class="w-32 h-32 text-black"></i>
                </div>
                <div class="flex justify-between items-start relative z-10">
                    <span class="font-bold border-b-2 border-white">残高</span>
                </div>
                <div class="text-5xl font-black font-mono relative z-10">¥163,000</div>
            </div>
        </div>

        <!-- Charts Area -->
        <div class="grid gap-6 md:grid-cols-2">
            <!-- Bar Chart Mockup -->
            <div class="neobrutal-card bg-white p-6">
                <h3 class="font-black text-xl mb-6 flex items-center gap-2">
                    <span class="bg-black text-white px-2 py-1 text-sm transform -skew-x-12">TRENDS</span>
                    月次推移
                </h3>
                <div class="h-48 flex items-end justify-between gap-2 px-2 border-b-4 border-black border-dashed">
                    <!-- Bars -->
                    <div class="w-full flex gap-1 h-[60%] items-end justify-center group relative">
                        <div
                            class="w-4 bg-emerald-400 border-2 border-black h-full group-hover:bg-emerald-300 transition-colors">
                        </div>
                        <div
                            class="w-4 bg-rose-400 border-2 border-black h-[40%] group-hover:bg-rose-300 transition-colors -ml-1 mb-1 shadow-hard-sm">
                        </div>
                    </div>
                    <div class="w-full flex gap-1 h-[55%] items-end justify-center group relative">
                        <div
                            class="w-4 bg-emerald-400 border-2 border-black h-full group-hover:bg-emerald-300 transition-colors">
                        </div>
                        <div
                            class="w-4 bg-rose-400 border-2 border-black h-[45%] group-hover:bg-rose-300 transition-colors -ml-1 mb-1 shadow-hard-sm">
                        </div>
                    </div>
                    <div class="w-full flex gap-1 h-[70%] items-end justify-center group relative">
                        <div
                            class="w-4 bg-emerald-400 border-2 border-black h-full group-hover:bg-emerald-300 transition-colors">
                        </div>
                        <div
                            class="w-4 bg-rose-400 border-2 border-black h-[35%] -ml-1 mb-1 shadow-hard-sm group-hover:bg-rose-300 transition-colors">
                        </div>
                    </div>
                </div>
                <div class="flex justify-between mt-2 font-mono text-xs font-bold">
                    <span>11月</span><span>12月</span><span>1月</span>
                </div>
            </div>

            <!-- Pie Chart Mockup -->
            <div class="neobrutal-card bg-white p-6 flex flex-col items-center">
                <h3 class="font-black text-xl mb-4 w-full text-left">
                    <span class="bg-black text-white px-2 py-1 text-sm transform -skew-x-12">BREAKDOWN</span>
                    利用内訳
                </h3>
                <div class="relative w-48 h-48 rounded-full border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] overflow-hidden"
                    style="background: conic-gradient(
                        hsl(265, 89%, 66%) 0% 45%,
                        hsl(188, 90%, 45%) 45% 70%,
                        hsl(50, 100%, 65%) 70% 100%
                     );">
                    <!-- Inner Cutout -->
                    <div
                        class="absolute inset-0 m-auto w-20 h-20 bg-white border-4 border-black rounded-full flex items-center justify-center">
                        <span class="font-black text-lg">合計</span>
                    </div>
                </div>
                <div class="mt-6 flex flex-wrap justify-center gap-3">
                    <div
                        class="flex items-center gap-2 border-2 border-black px-2 py-1 bg-primary text-white text-xs font-bold shadow-hard-sm">
                        <div class="w-3 h-3 bg-white border border-black"></div> 食費 45%
                    </div>
                    <div
                        class="flex items-center gap-2 border-2 border-black px-2 py-1 bg-[hsl(188,90%,45%)] text-white text-xs font-bold shadow-hard-sm">
                        <div class="w-3 h-3 bg-white border border-black"></div> 買い物 25%
                    </div>
                    <div
                        class="flex items-center gap-2 border-2 border-black px-2 py-1 bg-secondary text-black text-xs font-bold shadow-hard-sm">
                        <div class="w-3 h-3 bg-white border border-black"></div> 生活費 30%
                    </div>
                </div>
            </div>
        </div>

        <!-- List -->
        <div class="neobrutal-card bg-white p-6">
            <h3 class="font-black text-2xl mb-6 uppercase border-b-4 border-black inline-block">支払い予定</h3>

            <div class="space-y-4">
                <!-- Row 1 -->
                <div
                    class="flex items-center justify-between p-4 border-2 border-black bg-gray-50 hover:bg-yellow-50 transition-colors cursor-pointer group">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-white border-2 border-black flex items-center justify-center font-bold text-xl group-hover:bg-black group-hover:text-white transition-colors">
                            <i data-lucide="credit-card" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <div class="font-black text-lg">楽天カード</div>
                            <div class="text-xs font-mono font-bold text-gray-500">2024.02.27</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black font-mono text-xl">¥45,000</div>
                        <span
                            class="inline-block bg-white border-2 border-black px-2 py-0.5 text-xs font-bold mt-1 shadow-hard-sm">確定</span>
                    </div>
                </div>

                <!-- Row 2 -->
                <div
                    class="flex items-center justify-between p-4 border-2 border-black bg-gray-50 hover:bg-yellow-50 transition-colors cursor-pointer group">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-white border-2 border-black flex items-center justify-center font-bold text-xl group-hover:bg-black group-hover:text-white transition-colors">
                            <i data-lucide="home" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <div class="font-black text-lg">家賃</div>
                            <div class="text-xs font-mono font-bold text-gray-500">2024.02.28</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black font-mono text-xl">¥80,000</div>
                        <span
                            class="inline-block bg-white border-2 border-black border-dashed px-2 py-0.5 text-xs font-bold mt-1 text-gray-500">未確定</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center font-mono font-bold text-sm py-8 opacity-50">
        DESIGNED BY ANTIGRAVITY // 2026
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
