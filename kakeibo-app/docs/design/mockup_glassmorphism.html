<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakeibo App - Glassmorphism Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        glass: "rgba(255, 255, 255, 0.25)",
                        glassBorder: "rgba(255, 255, 255, 0.5)",
                        glassText: "rgba(255, 255, 255, 0.9)",
                        glassTextMuted: "rgba(255, 255, 255, 0.6)",
                    },
                    backdropBlur: {
                        xs: '2px',
                    },
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Zen Kaku Gothic New', sans-serif;
        }

        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .aurora-blob {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            filter: blur(80px);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #ff0080;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #7928ca;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 40%;
            width: 400px;
            height: 400px;
            background: #0070f3;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -50px);
            }

            66% {
                transform: translate(-20px, 20px);
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col p-4 md:p-8 gap-8">

    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <!-- Header -->
    <header
        class="glass-panel rounded-2xl px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 max-w-5xl mx-auto w-full z-10">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 p-2 rounded-lg">
                <i data-lucide="wallet" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">Glass Kakeibo</h1>
        </div>

        <nav class="flex bg-black/20 rounded-full p-1 gap-1">
            <a href="#" class="px-5 py-2 text-sm rounded-full bg-white/20 font-bold shadow-lg">ダッシュボード</a>
            <a href="#" class="px-5 py-2 text-sm rounded-full hover:bg-white/10 transition-colors">カード</a>
            <a href="#" class="px-5 py-2 text-sm rounded-full hover:bg-white/10 transition-colors">支払い</a>
        </nav>

        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-400 to-blue-500 border-2 border-white/20"></div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto w-full space-y-8 z-10">

        <!-- Date Selector -->
        <div class="flex items-center justify-between">
            <h2 class="text-3xl font-light">2024年 <span class="font-bold">2月</span></h2>
            <button class="glass-btn px-4 py-2 rounded-xl flex items-center gap-2 text-sm">
                <span>今月</span>
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="grid gap-6 md:grid-cols-3">

            <!-- Income -->
            <div class="glass-panel rounded-3xl p-6 relative overflow-hidden group hover:bg-white/5 transition-colors">
                <div class="absolute top-0 right-0 p-4 opacity-30">
                    <i data-lucide="arrow-up-right" class="w-16 h-16"></i>
                </div>
                <div class="text-glassTextMuted text-sm font-bold mb-1">今月の収入</div>
                <div class="text-3xl font-bold tracking-tight">¥245,000</div>
                <div
                    class="mt-4 flex items-center gap-2 text-xs text-green-300 bg-green-900/30 w-fit px-2 py-1 rounded-md">
                    <i data-lucide="trending-up" class="w-3 h-3"></i> +2.5%
                </div>
            </div>

            <!-- Expense -->
            <div class="glass-panel rounded-3xl p-6 relative overflow-hidden group hover:bg-white/5 transition-colors">
                <div class="absolute top-0 right-0 p-4 opacity-30">
                    <i data-lucide="arrow-down-right" class="w-16 h-16"></i>
                </div>
                <div class="text-glassTextMuted text-sm font-bold mb-1">今月の支出</div>
                <div class="text-3xl font-bold tracking-tight">¥82,000</div>
                <div class="mt-4 w-full bg-black/20 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-gradient-to-r from-pink-500 to-rose-500 w-[45%] h-full"></div>
                </div>
            </div>

            <!-- Balance -->
            <div
                class="glass-panel rounded-3xl p-6 relative overflow-hidden ring-2 ring-white/30 bg-gradient-to-br from-white/10 to-transparent">
                <div class="absolute -bottom-8 -right-8 opacity-20">
                    <div class="w-32 h-32 rounded-full bg-white blur-xl"></div>
                </div>
                <div class="text-glassTextMuted text-sm font-bold mb-1">現在の残高</div>
                <div
                    class="text-4xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-blue-200">
                    ¥163,000</div>
                <div class="mt-4 text-xs text-glassTextMuted">目標まであと ¥37,000</div>
            </div>
        </div>

        <!-- Charts Area -->
        <div class="grid gap-6 md:grid-cols-3">
            <!-- Bar Chart -->
            <div class="glass-panel rounded-3xl p-6 col-span-2">
                <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-1 h-6 bg-blue-400 rounded-full"></span>
                    収支推移
                </h3>
                <div class="h-48 flex items-end justify-around gap-4 px-2 pb-2 border-b border-white/10">
                    <!-- Bars with gradient -->
                    <div
                        class="w-8 h-[60%] bg-gradient-to-t from-emerald-500/50 to-emerald-400 rounded-t-lg relative group">
                        <div
                            class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-t-lg">
                        </div>
                        <div class="text-[10px] text-center mt-2 absolute -bottom-6 w-full text-glassTextMuted">11月
                        </div>
                    </div>
                    <div
                        class="w-8 h-[45%] bg-gradient-to-t from-rose-500/50 to-rose-400 rounded-t-lg relative group opacity-50">
                    </div>

                    <div
                        class="w-8 h-[55%] bg-gradient-to-t from-emerald-500/50 to-emerald-400 rounded-t-lg relative group">
                        <div
                            class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-t-lg">
                        </div>
                        <div class="text-[10px] text-center mt-2 absolute -bottom-6 w-full text-glassTextMuted">12月
                        </div>
                    </div>
                    <div
                        class="w-8 h-[50%] bg-gradient-to-t from-rose-500/50 to-rose-400 rounded-t-lg relative group opacity-50">
                    </div>

                    <div
                        class="w-8 h-[70%] bg-gradient-to-t from-emerald-500/50 to-emerald-400 rounded-t-lg relative group shadow-[0_0_15px_rgba(52,211,153,0.5)]">
                        <div
                            class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-t-lg">
                        </div>
                        <div class="text-[10px] text-center mt-2 absolute -bottom-6 w-full font-bold">1月</div>
                    </div>
                    <div
                        class="w-8 h-[60%] bg-gradient-to-t from-rose-500/50 to-rose-400 rounded-t-lg relative group opacity-80 shadow-[0_0_15px_rgba(244,63,94,0.5)]">
                    </div>
                </div>
            </div>

            <!-- Ring Chart -->
            <div class="glass-panel rounded-3xl p-6 flex flex-col items-center justify-center relative">
                <div
                    class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent pointer-events-none rounded-3xl">
                </div>
                <h3 class="text-lg font-bold mb-4 w-full text-left">カード利用率</h3>
                <!-- CSS Conic Gradient Ring -->
                <div class="w-40 h-40 rounded-full relative flex items-center justify-center"
                    style="background: conic-gradient(from 0deg, #f472b6 0% 45%, #60a5fa 45% 70%, #34d399 70% 100%); padding: 2px;">
                    <div
                        class="w-full h-full rounded-full bg-black/20 backdrop-blur-sm absolute top-0 left-0 animate-pulse opacity-50">
                    </div>
                    <div
                        class="w-32 h-32 bg-[#2d3748] rounded-full flex flex-col items-center justify-center relative z-10 glass-panel border-0">
                        <span class="text-xs text-glassTextMuted">TOTAL</span>
                        <span class="text-xl font-bold">¥82k</span>
                    </div>
                </div>
                <div class="mt-6 w-full space-y-2">
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-pink-400"></div> 食費
                        </div>
                        <span class="opacity-70">45%</span>
                    </div>
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-blue-400"></div> 買い物
                        </div>
                        <span class="opacity-70">25%</span>
                    </div>
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-emerald-400"></div> 生活費
                        </div>
                        <span class="opacity-70">30%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- List -->
        <div class="glass-panel rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h3 class="text-lg font-bold">支払い予定リスト</h3>
                <button
                    class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg transition-colors">すべて見る</button>
            </div>

            <div class="divide-y divide-white/10">
                <!-- Row 1 -->
                <div class="p-4 flex items-center justify-between hover:bg-white/5 transition-colors cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 rounded-xl bg-orange-500/20 text-orange-300 flex items-center justify-center border border-orange-500/30">
                            <i data-lucide="credit-card" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="font-bold">楽天カード</div>
                            <div class="text-xs text-glassTextMuted">02/27 引き落とし</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold">¥45,000</div>
                        <span
                            class="text-[10px] bg-blue-500/30 text-blue-200 px-2 py-0.5 rounded-full border border-blue-500/30">確定</span>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="p-4 flex items-center justify-between hover:bg-white/5 transition-colors cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-300 flex items-center justify-center border border-purple-500/30">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="font-bold">家賃</div>
                            <div class="text-xs text-glassTextMuted">02/28 予定</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold">¥80,000</div>
                        <span
                            class="text-[10px] bg-white/10 text-white/50 px-2 py-0.5 rounded-full border border-white/10">未確定</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
